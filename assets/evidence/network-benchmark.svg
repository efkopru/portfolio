<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title description">
  <title id="title">Design of the network experiments</title>
  <desc id="description">The experiments compared full and convex-hull-reduced hexagonal test networks. Six grid sizes, 61, 91, 127, 169, 217 and 271 cells, were combined with three target layouts, radial arms, near corners and seeded random, and four target counts, 3, 6, 9 and 12. This produced 72 paired configurations. Selected-edge costs match within every archived pair. The design diagram summarizes the saved experiments and is not a new solver result.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#43505d" stroke-width="1.8"/></marker>
  </defs>
  <rect width="1200" height="590" rx="10" fill="#f8fbfd"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101126">
    <text x="40" y="49" font-size="28" font-weight="700">Testing when a smaller search area helps</text>
    <text x="40" y="80" font-size="18" fill="#43505d">Experiments on hexagonal test networks</text>
    <g fill="#fff" stroke="#aebcc7" stroke-width="1.5">
      <rect x="40" y="114" width="340" height="144" rx="6"/>
      <rect x="430" y="114" width="340" height="144" rx="6"/>
      <rect x="820" y="114" width="340" height="144" rx="6"/>
    </g>
    <g font-size="32" font-weight="700" fill="#a45c00">
      <text x="63" y="159">6</text><text x="453" y="159">3</text><text x="843" y="159">4</text>
    </g>
    <g font-size="21" font-weight="700">
      <text x="98" y="157">grid sizes</text><text x="488" y="157">target layouts</text><text x="878" y="157">target counts</text>
    </g>
    <g font-size="18" fill="#43505d">
      <text x="63" y="198">61, 91, 127, 169, 217, 271</text>
      <text x="63" y="229">cells in each synthetic grid</text>
      <text x="453" y="198">Radial arms · Near corners</text>
      <text x="453" y="229">Seeded random</text>
      <text x="843" y="198">3, 6, 9, 12</text>
      <text x="843" y="229">targets reached from one source</text>
    </g>
    <g font-size="29" text-anchor="middle" fill="#43505d"><text x="405" y="194">×</text><text x="795" y="194">×</text></g>
    <path d="M600 272V303" fill="none" stroke="#43505d" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="300" y="320" width="600" height="64" rx="6" fill="#101126"/>
    <text x="600" y="361" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">72 paired configurations</text>
    <path d="M600 395V410H300V428M600 410H900V428" fill="none" stroke="#43505d" stroke-width="1.8" marker-end="url(#arrow)"/>
    <g fill="#edf3f7" stroke="#aebcc7" stroke-width="1.5">
      <rect x="80" y="441" width="440" height="67" rx="6"/>
      <rect x="680" y="441" width="440" height="67" rx="6"/>
    </g>
    <g text-anchor="middle" font-size="21" font-weight="700">
      <text x="300" y="482">Full network</text>
      <text x="900" y="482">Convex-hull-reduced network</text>
    </g>
    <text x="600" y="482" text-anchor="middle" font-size="17" fill="#43505d">compared with</text>
    <text x="600" y="550" text-anchor="middle" font-size="18" fill="#43505d">Matching selected-edge costs in all 72 saved pairs; the timing benefit varies by layout.</text>
  </g>
</svg>
