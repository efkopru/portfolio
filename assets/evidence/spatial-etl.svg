<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic spatial ETL: validate, load, verify and recover</title>
  <desc id="desc">Invented records pass schema and local-grid validation. Invalid rows enter quarantine. Accepted rows enter a SQLite transaction. A failure rolls back the whole batch; retry commits. A JSON report records the outcomes. Educational reconstruction, not employer architecture. Twelve synthetic input rows include eight rejected rows. Replay is a no-op, stale revisions are skipped, and recovery produces five final stored records. LOCAL:DEMO_CARTESIAN is an invented metre grid with no geographic reference. These are verified behaviors, not production performance claims.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="1200" height="570" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#253746">
    <text x="48" y="49" font-size="28" font-weight="700">Spatial ETL built to replay and recover</text>
    <text x="48" y="80" font-size="18">Validate inputs. Make atomic updates. Inspect what happens when a batch fails.</text>
    <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M288 199H332"/><path d="M576 199H620"/><path d="M864 199H908"/>
      <path d="M456 272V346"/><path d="M744 272V346"/><path d="M1032 272V346"/><path d="M864 410H908"/>
    </g>
    <g fill="#fff" stroke="#64748b">
      <rect x="48" y="126" width="240" height="146" rx="3"/><rect x="336" y="126" width="240" height="146" rx="3"/>
      <rect x="624" y="126" width="240" height="146" rx="3"/><rect x="912" y="126" width="240" height="146" rx="3"/>
      <rect x="336" y="350" width="240" height="122" rx="3"/><rect x="624" y="350" width="240" height="122" rx="3"/><rect x="912" y="350" width="240" height="122" rx="3"/>
    </g>
    <g font-size="20" font-weight="700"><text x="70" y="166">Invented JSON</text><text x="358" y="166">Validate + normalize</text><text x="646" y="166">SQLite transaction</text><text x="934" y="166">Commit + replay</text></g>
    <g font-size="17">
      <text x="70" y="210">12 synthetic input rows</text><text x="70" y="240">No Earth coordinates</text>
      <text x="358" y="210">Schema / CRS / bounds</text><text x="358" y="240">Time / revision / IDs</text>
      <text x="646" y="210">Bound SQL parameters</text><text x="646" y="240">Atomic versioned updates</text>
      <text x="934" y="210">Repeat is a no-op</text><text x="934" y="240">Stale revisions skipped</text>
    </g>
    <g font-size="16"><text x="472" y="315">invalid</text><text x="760" y="315">failure</text><text x="1048" y="315">verify</text></g>
    <g font-size="20" font-weight="700"><text x="358" y="386">Quarantine</text><text x="646" y="386">Injected failure</text><text x="934" y="386">JSON report</text></g>
    <g font-size="17">
      <text x="358" y="422">Reason + original row</text><text x="358" y="449">8 rejected input rows</text>
      <text x="646" y="422">Roll back entire batch</text><text x="646" y="449">Compare full snapshot</text>
      <text x="934" y="422">Retry succeeds</text><text x="934" y="449">5 final stored records</text>
    </g>
    <text x="48" y="371" font-size="18" font-weight="700">Behavior checks</text>
    <text x="48" y="404" font-size="17">Strict inputs</text><text x="48" y="432" font-size="17">Deterministic output</text><text x="48" y="460" font-size="17">Inspectable tests</text>
    <text x="48" y="523" font-size="16">Educational reconstruction, not employer architecture or production performance. No production data is used.</text>
    <text x="48" y="550" font-size="16">LOCAL:DEMO_CARTESIAN is an invented metre grid with no geographic reference.</text>
  </g>
</svg>
