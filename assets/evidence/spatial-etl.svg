<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic spatial ETL: validate, load, verify and recover</title>
  <desc id="desc">Invented records pass schema and local-grid validation. Invalid rows enter quarantine. Accepted rows enter a SQLite transaction. A failure rolls back the whole batch; retry commits. A JSON report records the outcomes. Educational reconstruction, not employer architecture.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27617b"/></marker></defs>
  <rect width="1200" height="600" rx="20" fill="#edf4f8"/>
  <g font-family="Arial, sans-serif" fill="#173446">
    <text x="48" y="59" font-size="28" font-weight="700">Spatial ETL: evidence through replay and recovery</text>
    <text x="48" y="93" font-size="18">Educational reconstruction | invented local-grid records | no production data</text>
    <g fill="#fff" stroke="#6b93a9" stroke-width="2">
      <rect x="48" y="145" width="225" height="105" rx="12"/>
      <rect x="333" y="145" width="235" height="105" rx="12"/>
      <rect x="632" y="145" width="235" height="105" rx="12"/>
      <rect x="927" y="145" width="225" height="105" rx="12"/>
      <rect x="333" y="329" width="235" height="105" rx="12" fill="#fff5e8"/>
      <rect x="632" y="329" width="235" height="105" rx="12" fill="#fff5e8"/>
      <rect x="927" y="329" width="225" height="105" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="19" font-weight="700">
      <text x="160" y="178">Invented JSON</text><text x="450" y="178">Validate + normalize</text>
      <text x="750" y="178">SQLite transaction</text><text x="1040" y="178">Commit + replay</text>
      <text x="450" y="362">Quarantine</text><text x="750" y="362">Injected failure</text><text x="1040" y="362">JSON report</text>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="160" y="209">No Earth coordinates</text><text x="160" y="234">12 synthetic input rows</text>
      <text x="450" y="209">Schema / CRS / bounds</text><text x="450" y="234">Time / revision / IDs</text>
      <text x="750" y="209">Bound SQL parameters</text><text x="750" y="234">Atomic versioned updates</text>
      <text x="1040" y="209">Repeat is a no-op</text><text x="1040" y="234">Stale revisions skipped</text>
      <text x="450" y="393">Reason + original row</text><text x="450" y="418">8 rejected input rows</text>
      <text x="750" y="393">Roll back entire batch</text><text x="750" y="418">Compare full snapshot</text>
      <text x="1040" y="393">Retry succeeds</text><text x="1040" y="418">5 final stored records</text>
    </g>
    <g fill="none" stroke="#27617b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M273 198H324"/><path d="M568 198H623"/><path d="M867 198H918"/>
      <path d="M450 250V319"/><path d="M750 250V319"/><path d="M1040 250V319"/>
      <path d="M867 382H918"/>
    </g>
    <text x="465" y="291" font-size="16">invalid</text><text x="765" y="291" font-size="16">failure path</text>
    <text x="48" y="502" font-size="18" font-weight="700">Verified behavior, not a production performance claim</text>
    <text x="48" y="535" font-size="17">Strict inputs, deterministic output, transaction rollback, retry, idempotency and inspectable tests.</text>
    <text x="48" y="562" font-size="17">LOCAL:DEMO_CARTESIAN is an invented metre grid with no geographic reference.</text>
  </g>
</svg>
