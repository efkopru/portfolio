<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="866" viewBox="0 0 1200 866" role="img" aria-labelledby="title desc">
<title id="title">Synthetic lead-pipe model evaluation</title>
<desc id="desc">Brier and log-loss comparison against training prevalence, plus a reliability plot. Generated from 200 held-out invented records in 40 disjoint groups. Not real-world performance. Both loss metrics use one common zero-based scale; the reliability plot uses equal zero-to-one axes.</desc>
<rect width="1200" height="866" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#253746">
<text x="40" y="47" font-size="16" fill="#5f6b73">Synthetic example</text>
<text x="40" y="94" font-size="32" font-weight="700">Lead-pipe model evaluation</text>
<text x="40" y="125" font-size="18" fill="#5f6b73">A reproducible comparison on invented records, with a fully separate holdout.</text>
<text x="40" y="174" font-size="18">Holdout: 200 properties in 40 groups</text>
<text x="40" y="203" font-size="17" fill="#5f6b73">Shared groups: 0 | Data seed: 2026</text>
<line x1="40" y1="229" x2="1160" y2="229" stroke="#d9dfe3"/>
<text x="60" y="280" font-size="23" font-weight="700">Held-out losses</text>
<text x="60" y="309" font-size="16" fill="#5f6b73">Lower is better. Both metrics share the same scale.</text>
<circle cx="68" cy="338" r="5" fill="#147d86"/>
<text x="82" y="344" font-size="15">Logistic model</text>
<circle cx="250" cy="338" r="5" fill="#87939b"/>
<text x="264" y="344" font-size="15">Training-prevalence baseline</text>
<text x="60" y="390" font-size="19" font-weight="700">Brier score</text>
<text x="60" y="429" font-size="16" fill="#5f6b73">Model</text>
<rect x="151" y="409" width="37.126" height="28" fill="#147d86" data-metric="brier_score" data-predictor="model"><title>Brier score, Model: 0.1238</title></rect>
<text x="465" y="429" font-size="17" font-weight="700">0.1238</text>
<text x="60" y="472" font-size="16" fill="#5f6b73">Baseline</text>
<rect x="151" y="452" width="71.616" height="28" fill="#87939b" data-metric="brier_score" data-predictor="baseline"><title>Brier score, Baseline: 0.2387</title></rect>
<text x="465" y="472" font-size="17" font-weight="700">0.2387</text>
<text x="60" y="539" font-size="19" font-weight="700">Log loss</text>
<text x="60" y="578" font-size="16" fill="#5f6b73">Model</text>
