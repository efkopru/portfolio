<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Ground patrol analytics: preparation, rules, and reporting</title>
  <desc id="desc">Three related components are shown independently. Inspection and work-order records are prepared for analysis. Condition findings are evaluated with explicit priority and work-type rules. GIS and Power BI views present inspection progress, defects, work orders, and costs. No automated connection between the components is asserted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#315f77" stroke-width="1.6" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="730" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#203748">
    <text x="48" y="54" font-size="30" font-weight="700">Ground patrol analytics</text>
    <text x="48" y="88" font-size="20" fill="#526674">Related components for preparing, prioritizing, and reviewing inspection data</text>

    <rect x="48" y="122" width="1104" height="166" rx="8" fill="#f0f5f8" stroke="#c7d7e1"/>
    <text x="70" y="155" font-size="16" font-weight="700" fill="#315f77" letter-spacing="1">01  PREPARE DATA</text>
    <g fill="#fff" stroke="#b9cbd7">
      <rect x="70" y="176" width="300" height="88" rx="5"/>
      <rect x="450" y="176" width="300" height="88" rx="5"/>
      <rect x="830" y="176" width="300" height="88" rx="5"/>
    </g>
    <g fill="none" stroke="#315f77" stroke-width="2" marker-end="url(#arrow)"><path d="M383 220H432"/><path d="M763 220H812"/></g>
    <g font-size="22" font-weight="700"><text x="88" y="210">Inspection exports</text><text x="468" y="210">Python and SQL</text><text x="848" y="210">Analysis-ready records</text></g>
    <g font-size="18" fill="#526674"><text x="88" y="242">Work orders and asset data</text><text x="468" y="242">Years, fields, joins, geography</text><text x="848" y="242">Relevant attributes and context</text></g>

    <rect x="48" y="308" width="1104" height="166" rx="8" fill="#fbf6e9" stroke="#e2d5b1"/>
    <text x="70" y="341" font-size="16" font-weight="700" fill="#745d29" letter-spacing="1">02  APPLY INSPECTION RULES</text>
    <g fill="#fff" stroke="#d7c89f">
      <rect x="70" y="362" width="300" height="88" rx="5"/>
      <rect x="450" y="362" width="300" height="88" rx="5"/>
      <rect x="830" y="362" width="300" height="88" rx="5"/>
    </g>
    <g fill="none" stroke="#315f77" stroke-width="2" marker-end="url(#arrow)"><path d="M383 406H432"/><path d="M763 406H812"/></g>
    <g font-size="22" font-weight="700"><text x="88" y="396">Recorded conditions</text><text x="468" y="396">Priority selection</text><text x="848" y="396">Assigned attributes</text></g>
    <g font-size="18" fill="#526674"><text x="88" y="428">One or more findings per record</text><text x="468" y="428">Urgency first; replacement on ties</text><text x="848" y="428">Priority, work type, job plan</text></g>

    <rect x="48" y="494" width="1104" height="166" rx="8" fill="#edf6f3" stroke="#bfd7ce"/>
    <text x="70" y="527" font-size="16" font-weight="700" fill="#326654" letter-spacing="1">03  REVIEW IN GIS AND POWER BI</text>
    <g fill="#fff" stroke="#b8cfc5">
      <rect x="70" y="548" width="330" height="88" rx="5"/>
      <rect x="435" y="548" width="330" height="88" rx="5"/>
      <rect x="800" y="548" width="330" height="88" rx="5"/>
    </g>
    <g font-size="22" font-weight="700"><text x="88" y="582">Inspection progress</text><text x="453" y="582">Defects and priorities</text><text x="818" y="582">Work orders and costs</text></g>
    <g font-size="18" fill="#526674"><text x="88" y="614">Status, completion, geography</text><text x="453" y="614">Year, material, damage category</text><text x="818" y="614">Job plans and recorded cost</text></g>
    <text x="48" y="701" font-size="17" fill="#526674">Conceptual overview of related historical work. Each row describes a separate component.</text>
  </g>
</svg>
