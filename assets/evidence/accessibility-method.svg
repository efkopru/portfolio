<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Community accessibility: explanatory method</title>
  <desc id="desc">Street-network isochrones describe access to community amenities. Accessibility measures are aggregated at census tract level and combined with socioeconomic indicators in weighted scoring to identify underserved areas. This is a method diagram, not measured geography or a reconstruction of internal scoring inputs. No real map, travel cutoff, scoring weight, or internal decision record is reproduced. The analysis supported a $750K federal award, not a model-accuracy measure or a sole-causality claim.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="1200" height="510" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#253746">
    <text x="48" y="49" font-size="28" font-weight="700">Measuring access to community amenities</text>
    <text x="48" y="80" font-size="18">Network accessibility and socioeconomic context inform planning evidence.</text>
    <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M294 212H330"/><path d="M580 212H616"/><path d="M866 212H902"/><path d="M743 350V292"/>
    </g>
    <g fill="#fff" stroke="#64748b">
      <rect x="48" y="136" width="246" height="152" rx="3"/><rect x="334" y="136" width="246" height="152" rx="3"/>
      <rect x="620" y="136" width="246" height="152" rx="3"/><rect x="906" y="136" width="246" height="152" rx="3"/>
      <rect x="620" y="352" width="246" height="76" rx="3"/>
    </g>
    <g font-size="21" font-weight="700"><text x="70" y="174">Network access</text><text x="356" y="174">Tract aggregation</text><text x="642" y="174">Weighted scoring</text><text x="928" y="174">Planning evidence</text></g>
    <g font-size="18">
      <text x="70" y="217">Street network</text><text x="70" y="247">Amenity isochrones</text>
      <text x="356" y="217">Reachable areas</text><text x="356" y="247">Census tract measures</text>
      <text x="642" y="217">Accessibility measures</text><text x="642" y="247">Socioeconomic context</text>
      <text x="928" y="217">Underserved areas</text><text x="928" y="247">Decision support</text>
      <text x="642" y="383">Socioeconomic</text><text x="642" y="409">indicators</text>
    </g>
    <text x="762" y="325" font-size="16">context input</text>
    <text x="48" y="345" font-size="18" font-weight="700">My contribution</text>
    <text x="48" y="376" font-size="17">Conducted the analysis; combined network-based</text><text x="48" y="402" font-size="17">accessibility with socioeconomic indicators.</text>
    <text x="48" y="460" font-size="16">Method illustration only. No real map, travel cutoff, scoring weight, or internal decision record is reproduced.</text>
    <text x="48" y="487" font-size="16">Supported a $750K federal award. This is not a model-accuracy measure or a sole-causality claim.</text>
  </g>
</svg>
