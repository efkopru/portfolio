    <text x="762" y="474" font-size="16" fill="#536b7d">context input</text>
    <text x="48" y="620" font-size="16" fill="#536b7d">Method illustration only. No real map, travel cutoff, scoring weight, or internal decision record is reproduced.</text>
    <text x="48" y="647" font-size="16" fill="#536b7d">Supported a $750K federal award. This is not a model-accuracy measure or a sole-causality claim.</text>
  </g>
</svg>
