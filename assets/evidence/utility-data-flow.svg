<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">Utility flight-track workflow</title>
  <desc id="desc">Collect flight metadata and GPS points, build ordered flight lines, match assets within 350 feet, then stage and append records to enterprise GIS. Outputs are flight lines and candidate asset coverage. Proximity does not independently confirm an inspection. This original explanatory diagram contains no client data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#718ca0" stroke-width="2" stroke-linejoin="round"/></marker>
  </defs>
  <g fill="none" stroke="#718ca0" stroke-width="3" marker-end="url(#arrow)">
    <path d="M280 101H312"/><path d="M578 101H610"/><path d="M876 101H908"/>
  </g>
  <g fill="#edf3f7" stroke="#aebcc7">
    <rect x="16" y="24" width="264" height="154" rx="4"/>
    <rect x="314" y="24" width="264" height="154" rx="4"/>
    <rect x="612" y="24" width="264" height="154" rx="4"/>
    <rect x="910" y="24" width="274" height="154" rx="4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#203748">
    <g font-size="17" fill="#43505d">
      <text x="34" y="55">1. COLLECT</text><text x="332" y="55">2. PREPARE</text>
      <text x="630" y="55">3. MATCH</text><text x="928" y="55">4. DELIVER</text>
    </g>
    <g font-size="23" font-weight="700">
      <text x="34" y="94">Collect records</text><text x="332" y="94">Build flight lines</text>
      <text x="630" y="94">Match nearby assets</text><text x="928" y="94">Update GIS</text>
    </g>
    <g font-size="19">
      <text x="34" y="130">Flight metadata</text><text x="34" y="155">and GPS points</text>
      <text x="332" y="130">Group by flight;</text><text x="332" y="155">order the track points</text>
      <text x="630" y="130">350-foot proximity</text><text x="630" y="155">and mapped attributes</text>
      <text x="928" y="130">Local staging, then</text><text x="928" y="155">enterprise append</text>
    </g>
    <rect x="16" y="208" width="1168" height="58" rx="4" fill="#edf3f7"/>
    <text x="36" y="245" font-size="22">Outputs: ordered flight lines and candidate asset coverage.</text>
  </g>
</svg>
