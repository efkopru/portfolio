<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Utility inspection pipeline: explanatory architecture</title>
  <desc id="desc">Operational records and helicopter tracks flow into Python and Selenium ingestion, enterprise geodatabase refresh, inspection priority calculations, and ArcGIS Portal publication. This newly authored diagram explains the public summary, not a client-system screenshot. No private records, locations, credentials, or source are shown. Components are conceptual; internal scheduling, schemas, and operational configuration are intentionally not reproduced.</desc>
