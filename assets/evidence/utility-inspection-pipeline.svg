<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Utility inspection pipeline: explanatory architecture</title>
  <desc id="desc">Operational records and helicopter tracks flow into Python and Selenium ingestion, enterprise geodatabase refresh, inspection priority calculations, and ArcGIS Portal publication. This newly authored diagram explains the public summary and does not expose private client systems or data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#527678"/></marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f4f7f6"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#456669">EXPLANATORY ARCHITECTURE</text>
    <text x="48" y="108" font-size="36" font-weight="700" fill="#183237">Utility inspection data pipeline</text>
    <text x="48" y="147" font-size="19" fill="#486267">From recurring operational inputs to refreshed spatial information.</text>
    <g stroke="#527678" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M248 290H282"/><path d="M470 290H504"/><path d="M692 290H726"/><path d="M914 290H948"/>
    </g>
    <g fill="#ffffff" stroke="#b8cecb" stroke-width="2">
      <rect x="48" y="212" width="200" height="165" rx="12"/><rect x="286" y="212" width="184" height="165" rx="12"/>
      <rect x="508" y="212" width="184" height="165" rx="12"/><rect x="730" y="212" width="184" height="165" rx="12"/>
      <rect x="952" y="212" width="200" height="165" rx="12"/>
    </g>
    <g fill="#183237" font-size="21" font-weight="700">
      <text x="68" y="251">Operational inputs</text><text x="306" y="251">Ingest</text><text x="528" y="251">Refresh</text><text x="750" y="251">Calculate</text><text x="972" y="251">Publish</text>
    </g>
    <g fill="#486267" font-size="17">
      <text x="68" y="291">Helicopter tracks</text><text x="68" y="321">Work orders</text><text x="68" y="351">Inspection records</text>
      <text x="306" y="291">Python</text><text x="306" y="321">Selenium</text><text x="306" y="351">Source integration</text>
      <text x="528" y="291">ArcPy + SQL</text><text x="528" y="321">Truncate / append</text><text x="528" y="351">Geodatabase tables</text>
      <text x="750" y="291">Inspection jobs</text><text x="750" y="321">Priority calculation</text><text x="750" y="351">Updated spatial data</text>
      <text x="972" y="291">ArcGIS Portal</text><text x="972" y="321">Refreshed data</text><text x="972" y="351">Analysis access</text>
    </g>
    <rect x="48" y="415" width="1104" height="77" rx="10" fill="#e1eeea"/>
    <text x="68" y="447" font-size="19" font-weight="700" fill="#204d43">My contribution</text>
    <text x="68" y="475" font-size="17" fill="#204d43">Engineered and maintained the ETL, record integration, geodatabase refresh, and Portal publication workflow.</text>
    <text x="48" y="540" font-size="16" fill="#486267">New public-summary diagram, not a client-system screenshot. No private records, locations, credentials, or source.</text>
    <text x="48" y="568" font-size="15" fill="#486267">Components are conceptual; internal scheduling, schemas, and operational configuration are intentionally not reproduced.</text>
  </g>
</svg>
