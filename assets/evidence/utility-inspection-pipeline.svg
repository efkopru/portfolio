<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Utility inspection pipeline: explanatory architecture</title>
  <desc id="desc">Operational records and helicopter tracks flow into Python and Selenium ingestion, enterprise geodatabase refresh, inspection priority calculations, and ArcGIS Portal publication. This newly authored diagram explains the public summary, not a client-system screenshot. No private records, locations, credentials, or source are shown. Components are conceptual; internal scheduling, schemas, and operational configuration are intentionally not reproduced.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="1200" height="440" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#253746">
    <text x="48" y="49" font-size="28" font-weight="700">Utility inspection data pipeline</text>
    <text x="48" y="80" font-size="18">Recurring operational inputs become refreshed spatial information.</text>
    <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M248 206H270"/><path d="M474 206H496"/><path d="M700 206H722"/><path d="M926 206H948"/>
    </g>
    <g fill="#fff" stroke="#64748b">
      <rect x="48" y="126" width="200" height="158" rx="3"/><rect x="274" y="126" width="200" height="158" rx="3"/>
      <rect x="500" y="126" width="200" height="158" rx="3"/><rect x="726" y="126" width="200" height="158" rx="3"/>
      <rect x="952" y="126" width="200" height="158" rx="3"/>
    </g>
    <g font-size="21" font-weight="700"><text x="68" y="163">Inputs</text><text x="294" y="163">Ingest</text><text x="520" y="163">Refresh</text><text x="746" y="163">Calculate</text><text x="972" y="163">Publish</text></g>
    <g font-size="17">
      <text x="68" y="203">Helicopter tracks</text><text x="68" y="232">Work orders</text><text x="68" y="261">Inspection records</text>
      <text x="294" y="203">Python + Selenium</text><text x="294" y="232">Source integration</text><text x="294" y="261">Operational records</text>
      <text x="520" y="203">ArcPy + SQL</text><text x="520" y="232">Truncate / append</text><text x="520" y="261">Geodatabase tables</text>
      <text x="746" y="203">Inspection jobs</text><text x="746" y="232">Priority calculation</text><text x="746" y="261">Updated spatial data</text>
      <text x="972" y="203">ArcGIS Portal</text><text x="972" y="232">Refreshed data</text><text x="972" y="261">Analysis access</text>
    </g>
    <text x="48" y="326" font-size="18" font-weight="700">My contribution</text>
    <text x="48" y="354" font-size="17">Engineered and maintained the ETL, record integration, geodatabase refresh, and Portal publication.</text>
    <text x="48" y="392" font-size="16">Public-summary diagram, not a client-system screenshot. No private records, locations, credentials, or source.</text>
