<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Shared edges versus independent shortest paths</title>
  <desc id="desc">The same invented four-node graph is shown in two panels. In the independent shortest-path union, two direct source-to-target edges cost six each, total twelve. In the shared network, a source-to-hub edge costs four and each hub-to-target edge costs three, total ten. Bold lines are selected edges; dashed lines are unselected alternatives. The teaching example checks all thirty-two edge subsets. Graph and cost units are invented, not dissertation benchmark data. Lower selected-edge cost does not mean shorter individual journeys.</desc>
  <rect width="1200" height="560" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#253746">
    <text x="48" y="49" font-size="28" font-weight="700">One source. Two targets. A shared connection.</text>
    <text x="48" y="80" font-size="18">Choose the lowest-cost set of edges that connects the source to both targets.</text>
    <text x="70" y="129" font-size="20" font-weight="700">Independent shortest-path union</text>
    <text x="642" y="129" font-size="20" font-weight="700">Shared network</text>
    <path d="M600 112V424" fill="none" stroke="#64748b" stroke-opacity=".35"/>
    <g fill="none" stroke-linejoin="round">
      <path d="M124 280H302L504 200M302 280L504 360" stroke="#64748b" stroke-opacity=".6" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M124 280 504 200M124 280 504 360" stroke="#236b70" stroke-width="4"/>
      <path d="M696 280 1076 200M696 280 1076 360" stroke="#64748b" stroke-opacity=".6" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M696 280H874L1076 200M874 280L1076 360" stroke="#236b70" stroke-width="4"/>
    </g>
    <g text-anchor="middle" font-size="18" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">
      <text x="303" y="245">6</text><text x="303" y="327">6</text>
      <text x="212" y="275">4</text><text x="403" y="243">3</text><text x="403" y="329">3</text>
      <text x="875" y="245">6</text><text x="875" y="327">6</text>
      <text x="784" y="275">4</text><text x="975" y="243">3</text><text x="975" y="329">3</text>
    </g>
    <g fill="#fff" stroke="#64748b" stroke-width="1.6">
      <circle cx="124" cy="280" r="23"/><circle cx="302" cy="280" r="23"/><circle cx="504" cy="200" r="23"/><circle cx="504" cy="360" r="23"/>
      <circle cx="696" cy="280" r="23"/><circle cx="874" cy="280" r="23"/><circle cx="1076" cy="200" r="23"/><circle cx="1076" cy="360" r="23"/>
    </g>
    <g font-size="19" text-anchor="middle">
      <text x="124" y="287">S</text><text x="302" y="287">H</text><text x="504" y="207">T1</text><text x="504" y="367">T2</text>
      <text x="696" y="287">S</text><text x="874" y="287">H</text><text x="1076" y="207">T1</text><text x="1076" y="367">T2</text>
    </g>
    <text x="314" y="417" text-anchor="middle" font-size="18" font-weight="700">Selected-edge cost: 6 + 6 = 12</text>
    <text x="886" y="417" text-anchor="middle" font-size="18" font-weight="700">Selected-edge cost: 4 + 3 + 3 = 10</text>
    <text x="48" y="460" font-size="17">S = source   H = hub   T1 / T2 = targets</text>
    <path d="M470 454h34" stroke="#236b70" stroke-width="4"/><text x="516" y="460" font-size="17">Selected</text>
    <path d="M628 454h34" stroke="#64748b" stroke-opacity=".6" stroke-width="2" stroke-dasharray="6 6"/><text x="674" y="460" font-size="17">Not selected</text>
    <text x="1152" y="460" text-anchor="end" font-size="17">32 edge subsets checked</text>
    <text x="48" y="508" font-size="16">Invented graph and cost units. Not dissertation benchmark data.</text>
    <text x="48" y="535" font-size="16">Lower selected-edge cost does not mean shorter individual journeys.</text>
  </g>
</svg>
