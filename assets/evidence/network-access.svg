<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Shared edges versus independent shortest paths</title>
  <desc id="desc">The same invented four-node graph is shown in two panels. In the independent shortest-path union, two direct source-to-target edges cost six each, total twelve. In the shared network, a source-to-hub edge costs four and each hub-to-target edge costs three, total ten. Bold lines are selected edges; dashed lines are unselected alternatives. The teaching example checks all thirty-two edge subsets. Graph and cost units are invented, not dissertation benchmark data. Lower selected-edge cost does not mean shorter individual journeys.</desc>
  <defs>
    <linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#edf4f7"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dy="5" stdDeviation="7" flood-color="#17324a" flood-opacity=".055"/></filter>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#wash)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="40" width="6" height="25" rx="3" fill="#147d86"/>
    <text x="68" y="59" font-size="16" font-weight="700" letter-spacing="1.7" fill="#147d86">WORKED EXAMPLE / NETWORK OPTIMIZATION</text>
    <text x="48" y="115" font-size="36" font-weight="700" fill="#17324a">One source. Two targets. A shared connection.</text>
    <text x="48" y="151" font-size="19" fill="#536b7d">Choose the lowest-cost set of edges that connects the source to both targets.</text>
    <g fill="#fff" stroke="#dbe5ed" filter="url(#shadow)"><rect x="48" y="196" width="532" height="330" rx="18"/><rect x="620" y="196" width="532" height="330" rx="18"/></g>
    <rect x="70" y="219" width="35" height="30" rx="8" fill="#eaf0f9"/><text x="88" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#3e75b6">01</text>
    <text x="117" y="241" font-size="20" font-weight="700" fill="#17324a">Independent shortest-path union</text>
    <rect x="642" y="219" width="35" height="30" rx="8" fill="#eaf4f5"/><text x="660" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#147d86">02</text>
    <text x="689" y="241" font-size="20" font-weight="700" fill="#17324a">Shared network</text>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M124 366H302L504 286M302 366L504 446" stroke="#c3d0dc" stroke-width="3" stroke-dasharray="6 7"/>
      <path d="M124 366 504 286M124 366 504 446" stroke="#3e75b6" stroke-width="6"/>
      <path d="M696 366 1076 286M696 366 1076 446" stroke="#c3d0dc" stroke-width="3" stroke-dasharray="6 7"/>
      <path d="M696 366H874L1076 286M874 366L1076 446" stroke="#147d86" stroke-width="6"/>
    </g>
    <g fill="#fff" stroke="#dbe5ed">
      <rect x="288" y="311" width="30" height="28" rx="8"/><rect x="288" y="393" width="30" height="28" rx="8"/>
      <rect x="197" y="341" width="30" height="28" rx="8"/><rect x="388" y="309" width="30" height="28" rx="8"/><rect x="388" y="395" width="30" height="28" rx="8"/>
      <rect x="860" y="311" width="30" height="28" rx="8"/><rect x="860" y="393" width="30" height="28" rx="8"/>
      <rect x="769" y="341" width="30" height="28" rx="8"/><rect x="960" y="309" width="30" height="28" rx="8"/><rect x="960" y="395" width="30" height="28" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="18" font-weight="700">
      <g fill="#3e75b6"><text x="303" y="331">6</text><text x="303" y="413">6</text></g>
      <g fill="#6c8090"><text x="212" y="361">4</text><text x="403" y="329">3</text><text x="403" y="415">3</text><text x="875" y="331">6</text><text x="875" y="413">6</text></g>
      <g fill="#147d86"><text x="784" y="361">4</text><text x="975" y="329">3</text><text x="975" y="415">3</text></g>
    </g>
    <g fill="#fff" stroke-width="2.5">
      <g stroke="#3e75b6"><circle cx="124" cy="366" r="25"/><circle cx="504" cy="286" r="25"/><circle cx="504" cy="446" r="25"/></g>
      <circle cx="302" cy="366" r="25" stroke="#b8c9d6"/>
      <g stroke="#147d86"><circle cx="696" cy="366" r="25"/><circle cx="874" cy="366" r="25"/><circle cx="1076" cy="286" r="25"/><circle cx="1076" cy="446" r="25"/></g>
    </g>
    <g fill="#17324a" font-size="20" font-weight="700" text-anchor="middle">
      <text x="124" y="373">S</text><text x="302" y="373">H</text><text x="504" y="293">T1</text><text x="504" y="453">T2</text>
      <text x="696" y="373">S</text><text x="874" y="373">H</text><text x="1076" y="293">T1</text><text x="1076" y="453">T2</text>
    </g>
    <rect x="70" y="480" width="488" height="29" rx="8" fill="#eaf0f9"/><text x="314" y="501" text-anchor="middle" font-size="18" font-weight="700" fill="#3e75b6">Selected-edge cost: 6 + 6 = 12</text>
    <rect x="642" y="480" width="488" height="29" rx="8" fill="#eaf4f5"/><text x="886" y="501" text-anchor="middle" font-size="18" font-weight="700" fill="#147d86">Selected-edge cost: 4 + 3 + 3 = 10</text>
    <text x="48" y="564" font-size="17" fill="#536b7d">S = source   H = hub   T1 / T2 = targets</text>
    <path d="M470 558h34" stroke="#147d86" stroke-width="5" stroke-linecap="round"/><text x="516" y="564" font-size="17" fill="#536b7d">Selected</text>
    <path d="M628 558h34" stroke="#aebfcd" stroke-width="3" stroke-dasharray="6 7"/><text x="674" y="564" font-size="17" fill="#536b7d">Not selected</text>
    <text x="1152" y="564" text-anchor="end" font-size="17" font-weight="700" fill="#17324a">32 edge subsets checked</text>
    <path d="M48 590H1152" stroke="#dbe5ed"/>
    <text x="48" y="625" font-size="16" fill="#536b7d">Invented graph and cost units. Not dissertation benchmark data.</text>
    <text x="48" y="652" font-size="16" fill="#536b7d">Lower selected-edge cost does not mean shorter individual journeys.</text>
  </g>
</svg>
